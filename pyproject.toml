[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-powered-document-intelligence-system"
version = "0.1.0"
description = "It is a assignment project, where their are total 7 task; AI-Information Extraction, Data Validation, Backend API, Database and serach, Frontend. Frontend will be separated project. "
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==25.1.0",
    "fastapi>=0.115,<1.0",
    "openpyxl==3.1.5",
    "Pillow==13.0.0",
    "pymongo>=4.13,<5",
    "pydantic-settings>=2.6,<3.0",
    "PyMuPDF==2.0",
    "structlog>=24.4,<26.0",
    "types-openpyxl>=3.1,<4.0",
    "types-xlrd>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "httpx2>=2.0,<3.0",
    "mypy>=1.13,<2.0",
    "pip-audit>=2.7,<3.0",
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
    "types-aiofiles==25.1.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
markers = [
    "unit: isolated unit tests",
    "integration: tests that exercise the application boundary",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
